<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surge · 3D circuit workbench</title>
  <link rel="icon" href="/editor/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/editor/editor.css" />
  <link rel="stylesheet" href="/editor/chat.css" />
  <link rel="stylesheet" href="/editor/projects.css" />
  <link rel="stylesheet" href="/editor/scene.css" />
  <link rel="stylesheet" href="/editor/code.css" />
  <script>if (/[?&]home\b/.test(location.search)) document.documentElement.classList.add('scene');</script>
</head>
<body>

<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-left-group">
      <a class="topbar-brand" href="/" title="Surge workbench">
        <span class="brand-mark">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.2 5.6H9.9L7.4 8.1v1.6l2.3 2.3h4.6l2.3 2.3v1.6l-2.5 2.5H7.8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16.6" cy="5.6" r="2" fill="#fff"/><circle cx="16.6" cy="5.6" r=".8" fill="#e98b0b"/><circle cx="7.4" cy="18.4" r="2" fill="#fff"/><circle cx="7.4" cy="18.4" r=".8" fill="#e98b0b"/></svg>
        </span>
        Surge
      </a>
      <span class="topbar-name-sep">/</span>
      <span id="circuit-name-field"
            contenteditable="true"
            spellcheck="false"
            title="Click to rename"
            onblur="App.state.circuitName = this.textContent.trim() || 'Untitled'; this.textContent = App.state.circuitName; if(App.scheduleAutoSave) App.scheduleAutoSave();"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">Untitled</span>
    </div>

    <div class="topbar-center">
      <div class="seg" role="group" aria-label="View">
        <button class="mode-btn active" data-view="board" title="Board view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M11 9h.01M15 9h.01M7 13h.01M11 13h.01M15 13h.01"/></svg>
          Board
        </button>
        <button class="mode-btn" data-view="code" title="Code view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/></svg>
          Code
        </button>
      </div>
      <div class="run-group">
      <button class="btn-simulate" id="sim-run-btn" onclick="App.runSimulation()" title="Run the circuit">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        Run
      </button>
      <button class="btn-stop" id="sim-stop-btn" onclick="App.stopSimulation()" style="display:none">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        Stop
      </button>
      </div>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" onclick="App.undo()" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="icon-btn" onclick="App.redo()" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <span class="topbar-divider"></span>
      <button class="btn-secondary" onclick="App.openProjects()" title="Open a .surge file">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-8l-2-3H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/></svg>
        Open
      </button>
      <button class="btn-secondary" onclick="App.saveCircuit()" title="Download as a .surge file">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        Download
      </button>
    </div>
  </header>

  <!-- BODY -->
  <div id="body">

    <!-- PARTS LIBRARY -->
    <aside id="sidebar">
      <div class="sidebar-section-label">Power</div>
      <button class="comp-item" data-type="battery">
        <span class="comp-item-icon" data-thumb="battery"></span>
        <span class="comp-item-text"><span class="comp-item-name">Battery</span></span>
      </button>

      <div class="sidebar-section-label">Passive</div>
      <button class="comp-item" data-type="resistor">
        <span class="comp-item-icon" data-thumb="resistor"></span>
        <span class="comp-item-text"><span class="comp-item-name">Resistor</span></span>
      </button>
      <button class="comp-item" data-type="capacitor">
        <span class="comp-item-icon" data-thumb="capacitor"></span>
        <span class="comp-item-text"><span class="comp-item-name">Capacitor</span></span>
      </button>
      <button class="comp-item" data-type="potentiometer">
        <span class="comp-item-icon" data-thumb="potentiometer"></span>
        <span class="comp-item-text"><span class="comp-item-name">Potentiometer</span></span>
      </button>

      <div class="sidebar-section-label">Inputs</div>
      <button class="comp-item" data-type="button">
        <span class="comp-item-icon" data-thumb="button"></span>
        <span class="comp-item-text"><span class="comp-item-name">Push button</span></span>
      </button>
      <button class="comp-item" data-type="ultrasonic">
        <span class="comp-item-icon" data-thumb="ultrasonic"></span>
        <span class="comp-item-text"><span class="comp-item-name">Ultrasonic sensor</span></span>
      </button>

      <div class="sidebar-section-label">Outputs</div>
      <button class="comp-item" data-type="led">
        <span class="comp-item-icon" data-thumb="led"></span>
        <span class="comp-item-text"><span class="comp-item-name">LED</span></span>
      </button>
      <button class="comp-item" data-type="buzzer">
        <span class="comp-item-icon" data-thumb="buzzer"></span>
        <span class="comp-item-text"><span class="comp-item-name">Buzzer</span></span>
      </button>
      <button class="comp-item" data-type="seg7">
        <span class="comp-item-icon" data-thumb="seg7"></span>
        <span class="comp-item-text"><span class="comp-item-name">7-segment display</span></span>
      </button>
      <button class="comp-item" data-type="fan">
        <span class="comp-item-icon" data-thumb="fan"></span>
        <span class="comp-item-text"><span class="comp-item-name">DC fan</span></span>
      </button>
      <button class="comp-item" data-type="servo">
        <span class="comp-item-icon" data-thumb="servo"></span>
        <span class="comp-item-text"><span class="comp-item-name">Servo</span></span>
      </button>

      <div class="sidebar-section-label">Boards and chips</div>
      <button class="comp-item" data-type="esp32">
        <span class="comp-item-icon" data-thumb="esp32"></span>
        <span class="comp-item-text"><span class="comp-item-name">ESP32</span></span>
      </button>
      <button class="comp-item" data-type="transistor">
        <span class="comp-item-icon" data-thumb="transistor"></span>
        <span class="comp-item-text"><span class="comp-item-name">Transistor</span></span>
      </button>

      <div class="sidebar-section-label">Wiring</div>
      <button class="comp-item" data-type="wire" id="wire-tool-btn">
        <span class="comp-item-icon" data-thumb="wire"></span>
        <span class="comp-item-text"><span class="comp-item-name">Jumper wire</span></span>
      </button>

      <div id="wire-color-row" style="display:none;">
        <div class="color-swatches" role="radiogroup" aria-label="Wire color">
          <button class="swatch active" data-color="0xef4444" style="background:#ef4444" title="Red" aria-label="Red"></button>
          <button class="swatch" data-color="0x111111" style="background:#1f1f1f" title="Black" aria-label="Black"></button>
          <button class="swatch" data-color="0xfbbf24" style="background:#fbbf24" title="Yellow" aria-label="Yellow"></button>
          <button class="swatch" data-color="0x22c55e" style="background:#22c55e" title="Green" aria-label="Green"></button>
          <button class="swatch" data-color="0x3b82f6" style="background:#3b82f6" title="Blue" aria-label="Blue"></button>
          <button class="swatch" data-color="0xffffff" style="background:#f4f4f4" title="White" aria-label="White"></button>
        </div>
      </div>
    </aside>

    <!-- 3D CANVAS -->
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>

      <div id="hint-box" class="hint-hidden">
        <span id="hint-text"></span>
      </div>

      <div id="hole-label"></div>


      <div class="view-tools">
        <button id="clear-all-btn" title="Clear the board" style="display:none" onclick="App.clearAll()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M9 6V4h6v2"/></svg>
          Clear
        </button>
        <button id="reset-cam-btn" title="Reset the view" onclick="App.resetView && App.resetView()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset view
        </button>
      </div>
    </div>

    <!-- CODE VIEW -->
    <section id="code-view" hidden aria-label="ESP32 code editor">
      <div class="code-tabs">
        <div class="code-tab-list" role="tablist" aria-label="Sketch files"></div>
      </div>
      <div class="code-main">
        <div class="code-gutter" aria-hidden="true"><div class="code-gutter-inner"></div></div>
        <div class="code-stack">
          <pre class="code-highlight" aria-hidden="true"><code></code></pre>
          <textarea class="code-input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Sketch source"></textarea>
        </div>
      </div>
      <div class="code-status">
        <span>ESP32 · Arduino C++ · <span id="code-used-by"></span></span>
        <span id="code-pos">Ln 1, Col 1</span>
      </div>
    </section>

    <!-- Surge PANEL -->
    <div id="surge-panel">
      <div class="surge-header">
        <button id="surge-clear" class="icon-btn" title="New chat" aria-label="New chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>

      <div id="surge-messages">
        <div id="surge-welcome">
          <div class="surge-welcome-title">What should we build?</div>
          <div id="surge-suggestions">
            <button class="surge-suggest-btn" onclick="surgeQuick('Build a complete working LED circuit from scratch.')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
              <span>Build an LED circuit</span>
            </button>
            <button class="surge-suggest-btn" onclick="surgeQuick('Build a circuit where a push button turns an LED on.')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
              <span>Add a button that switches it</span>
            </button>
            <button class="surge-suggest-btn" onclick="surgeQuick('Look at my board and tell me whether it will work, and why.')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span>Check my circuit</span>
            </button>
          </div>
        </div>
      </div>

      <div id="surge-pending-bar" style="display:none">
        <span id="surge-pending-count">Changes ready</span>
        <button class="pending-decline" onclick="surgeDeclineChanges()">Discard</button>
        <button class="pending-accept" onclick="surgeAcceptChanges()">Apply <kbd>Enter</kbd></button>
      </div>

      <div id="surge-input-row">
        <div class="surge-input-box">
          <textarea id="surge-input" rows="1" placeholder="Ask Surge…" aria-label="Message Surge"></textarea>
          <button id="surge-send" title="Send" aria-label="Send">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Clear Board Modal -->
  <div id="clear-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="clear-modal-title">
    <div class="lpm-card">
      <div class="lpm-name" id="clear-modal-title">Clear the board?</div>
      <div class="lpm-btns">
        <button class="btn-secondary" id="clear-modal-cancel">Cancel</button>
        <button class="btn-danger" id="clear-modal-confirm">Delete all</button>
      </div>
    </div>
  </div>

  <!-- Load Preview Modal -->
  <div id="load-preview-modal" style="display:none">
    <div class="lpm-card">
      <div class="lpm-thumb">
        <img id="lpm-img" src="" alt="Circuit preview" style="display:none">
        <div id="lpm-placeholder">No preview available</div>
      </div>
      <div class="lpm-name" id="lpm-name"></div>
      <div class="lpm-meta" id="lpm-meta"></div>
      <div class="lpm-btns">
        <button class="btn-simulate" id="lpm-confirm">Load circuit</button>
        <button class="btn-secondary" onclick="document.getElementById('load-preview-modal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

</div>

<!-- Three.js -->




<!-- App modules (load in dependency order) -->












<script type="module" src="/src/workbench.ts"></script>
</body>
</html>
