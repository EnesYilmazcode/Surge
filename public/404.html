<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Surge</title>
  <meta name="theme-color" content="#1A1814" />
  <link rel="icon" href="/editor/mark.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #1A1814;
      color: #F4F1EA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: clamp(2rem, 4vw + 1rem, 3.25rem);
      letter-spacing: -0.035em;
      line-height: 1.05;
    }
    p { margin-top: 0.9rem; color: #D8D2C7; }
    a {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      background: #B45309;
      color: #fff;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #92400E; }
    a:focus-visible { outline: 2px solid #F59E0B; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>That page isn't here</h1>
    <p>The link may be old, or the page may have moved.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
