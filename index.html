<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surge: 3D circuit workbench</title>
  <meta name="description" content="A 3D breadboard in your browser. Place real parts, wire them up, and press Run." />
  <meta name="theme-color" content="#1A1814" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Surge: 3D circuit workbench" />
  <meta property="og:description" content="Place real parts on a 3D breadboard, wire them up, and press Run." />
  <meta property="og:url" content="https://surge-flow.web.app/" />
  <link rel="icon" href="/editor/mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --night:      #1A1814;
      --ink:        #F4F1EA;
      --ink-2:      #D8D2C7;
      --amber:      #F59E0B;
      --amber-ink:  #B45309;
      --amber-deep: #92400E;
      --edge:       clamp(1.25rem, 3.2vw, 3.5rem);
      --head:       'Space Grotesk', system-ui, sans-serif;
      --body:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      background: var(--night);
      color: var(--ink);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      /* The page is a scene to look at, not a document to select from. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* No scrollbar: the page scrolls by wheel, keys or touch. */
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .skip {
      position: absolute; left: var(--edge); top: -3rem; z-index: 300;
      background: var(--ink); color: var(--night);
      padding: 0.5rem 0.9rem; border-radius: 8px;
      font-weight: 600; font-size: 0.875rem; text-decoration: none;
    }
    .skip:focus { top: 0.75rem; }

    /* ── The scene stays fixed while the text scrolls over it ── */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #23262b;
    }
    .stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    .is-loaded .stage iframe { opacity: 1; }
    /* A light wash so the scene stays a little back from the text. */
    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 70% 45%, rgba(20,18,15,0) 0%, rgba(20,18,15,0.45) 85%);
    }

    /* ── Top bar, transparent over the scene ─────────────── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem var(--edge);
      background: linear-gradient(180deg, rgba(20,18,15,0.78) 0%, rgba(20,18,15,0) 100%);
      pointer-events: none;
    }
    .nav > * { pointer-events: auto; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--head);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .brand img { display: block; border-radius: 7px; }
    .nav-links { display: flex; align-items: center; gap: 0.5rem; }
    .nav-link {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--ink-2);
      text-decoration: none;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
    }
    .nav-link:hover { color: var(--ink); }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0 1.4rem;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: var(--head);
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn-primary {
      background: var(--amber-ink);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 2px rgba(0,0,0,0.3);
    }
    .btn-primary:hover { background: var(--amber-deep); }
    .btn-ghost {
      background: rgba(20,18,15,0.35);
      color: var(--ink);
      border-color: rgba(244,241,234,0.32);
    }
    .btn-ghost:hover { border-color: rgba(244,241,234,0.6); background: rgba(20,18,15,0.5); }
    .btn-sm { min-height: 2.25rem; padding: 0 0.9rem; font-size: 0.9rem; border-radius: 8px; }

    /* ── The page: one screen per checkpoint, text over the scene ─ */
    .track {
      position: relative;
      z-index: 1;
    }
    .beat {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6rem var(--edge);
    }
    .beat-left  { justify-content: flex-start; }
    .beat-right { justify-content: flex-end; }
    .beat-center { justify-content: center; text-align: center; }

    .card {
      max-width: 31rem;
      padding: 1.1rem 1.5rem;
      border-radius: 14px;
      background: rgba(20,18,15,0.6);
    }
    .card h2 {
      font-family: var(--head);
      font-size: clamp(1.75rem, 2.2vw + 1rem, 2.75rem);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .intro h1 {
      font-family: var(--head);
      font-size: clamp(2.6rem, 4.6vw + 1rem, 5.25rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.045em;
      text-wrap: balance;
      text-shadow: 0 2px 24px rgba(0,0,0,0.35);
    }
    .lede {
      margin-top: 1.25rem;
      max-width: 30rem;
      font-size: clamp(1.05rem, 0.4vw + 0.95rem, 1.2rem);
      line-height: 1.55;
      color: var(--ink-2);
      text-shadow: 0 1px 12px rgba(0,0,0,0.5);
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .closing h2 {
      font-size: clamp(2.2rem, 3vw + 1rem, 3.75rem);
    }
    .closing .hero-actions { justify-content: center; }

    /* ── Credits ─────────────────────────────────────────── */
    .credits {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem var(--edge) 2.5rem;
      font-size: 0.8125rem;
      color: var(--ink-2);
    }
    .credits a { color: var(--ink-2); text-underline-offset: 3px; }
    .credits a:hover { color: var(--amber); }

    /* ── Motion: the text rises in as it enters ───────────── */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .card.in { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage iframe { transition-duration: 0.01ms; }
    }

    /* ── Small screens: text along the bottom ────────────── */
    @media (max-width: 720px) {
      .beat { align-items: flex-end; padding-bottom: 5.5rem; }
      .beat-left, .beat-right { justify-content: stretch; }
      .card { max-width: none; }
      .stage::after {
        background: linear-gradient(0deg, rgba(20,18,15,0.85) 0%, rgba(20,18,15,0.35) 55%, rgba(20,18,15,0) 80%);
      }
      .intro { align-items: flex-end; }
      .hero-actions .btn { flex: 1 1 auto; }
      .nav-link { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#copy">Skip to text</a>

  <div class="stage" aria-hidden="true">
    <iframe id="stage-frame" src="app.html?showcase=1" title="A 3D breadboard that builds a circuit as you scroll" tabindex="-1"></iframe>
  </div>

  <header class="nav">
    <a href="/" class="brand">
      <img src="/editor/mark.svg" width="28" height="28" alt="" />
      Surge
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="https://github.com/EnesYilmazcode/Surge" class="nav-link" target="_blank" rel="noopener">GitHub</a>
      <a href="app.html" class="btn btn-sm btn-primary">Open the editor</a>
    </nav>
  </header>

  <main class="track">
    <section class="beat intro" id="copy" aria-labelledby="headline">
      <div class="card intro-copy">
        <h1 id="headline">Snap a circuit together in 3D</h1>
        <p class="lede">Place parts, wire them up, and press Run.</p>
        <div class="hero-actions">
          <a href="app.html" class="btn btn-primary">Open the editor</a>
          <a href="app.html?demo" class="btn btn-ghost">Try the demo</a>
        </div>
      </div>
    </section>

    <section class="beat beat-right">
      <div class="card">
        <h2>Place real parts</h2>
      </div>
    </section>

    <section class="beat beat-left">
      <div class="card">
        <h2>Wire it up</h2>
      </div>
    </section>

    <section class="beat beat-right">
      <div class="card">
        <h2>Press Run</h2>
      </div>
    </section>

    <section class="beat beat-left">
      <div class="card">
        <h2>Save in your browser</h2>
      </div>
    </section>

    <section class="beat beat-center closing">
      <div class="card">
        <h2>Build it, then press Run.</h2>
        <div class="hero-actions">
          <a href="app.html" class="btn btn-primary">Open the editor</a>
          <a href="app.html?demo" class="btn btn-ghost">Try the demo</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="credits">
    By <a href="https://github.com/EnesYilmazcode" target="_blank" rel="noopener">Enes Yilmaz</a> and <a href="https://github.com/ColinL-code" target="_blank" rel="noopener">Colin Lee</a>
  </footer>

  <script type="module" src="/src/landing.ts"></script>
</body>
</html>
