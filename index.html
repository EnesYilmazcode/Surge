<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surge: 3D circuit workbench</title>
  <meta name="description" content="A 3D breadboard in your browser. Build a circuit, then press Run." />
  <meta name="theme-color" content="#23262b" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Surge: 3D circuit workbench" />
  <meta property="og:description" content="A 3D breadboard in your browser. Build a circuit, then press Run." />
  <meta property="og:url" content="https://surge-flow.web.app/" />
  <link rel="icon" href="/editor/mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #23262b;
      color: #F4F1EA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    /* The scene fills the page. There is nothing to scroll. */
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .is-loaded .scene { opacity: 1; }

    /* A small top bar: the name, and a way into the editor. */
    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 1.4rem;
      pointer-events: none;
    }
    .top a {
      pointer-events: auto;
      color: #F4F1EA;
      text-decoration: none;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .brand { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.05rem !important; }
    .brand img { display: block; width: 26px; height: 26px; border-radius: 7px; }
    .open { opacity: 0.75; transition: opacity 0.2s ease, color 0.2s ease; }
    .open:hover { opacity: 1; color: #F59E0B; }
    .open:focus-visible, .brand:focus-visible {
      outline: 2px solid #F59E0B;
      outline-offset: 3px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <iframe class="scene" id="scene" src="app.html?home=1" title="A 3D breadboard with a circuit on it. A green button on the bench runs the circuit."></iframe>

  <header class="top">
    <a class="brand" href="/">
      <img src="/editor/mark.svg" width="26" height="26" alt="" />
      Surge
    </a>
    <a class="open" href="app.html">Open the editor</a>
  </header>

  <script>
    // The scene fades in once it has loaded.
    const scene = document.getElementById('scene');
    scene.addEventListener('load', () => {
      setTimeout(() => document.documentElement.classList.add('is-loaded'), 300);
    });
  </script>
</body>
</html>
