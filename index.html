<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surge: 3D circuit workbench</title>
  <meta name="description" content="A 3D breadboard in your browser. Build a circuit, then press Run." />
  <meta name="theme-color" content="#23262b" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Surge: 3D circuit workbench" />
  <meta property="og:description" content="A 3D breadboard in your browser. Build a circuit, then press Run." />
  <meta property="og:url" content="https://surge-flow.web.app/" />
  <link rel="icon" href="/editor/mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #23262b;
      color: #F4F1EA;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    /* The scene fills the page. There is nothing to scroll. */
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .is-loaded .scene { opacity: 1; }

    /* Nothing sits over the scene: the 3D title names the page and the green
       button opens the editor. These two are for screen readers and keyboards. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    /* The bench button cannot take focus, so Tab finds this link instead. */
    .open {
      position: fixed;
      top: 1rem;
      right: 1.2rem;
      z-index: 2;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      background: #F59E0B;
      color: #23262b;
      text-decoration: none;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      transform: translateY(-200%);
    }
    .open:focus-visible {
      transform: none;
      outline: 2px solid #F4F1EA;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <iframe class="scene" id="scene" src="app.html?home=1" title="A 3D breadboard with a circuit on it. A green button on the bench runs the circuit."></iframe>

  <h1 class="sr-only">Surge</h1>

  <a class="open" href="app.html">Open the editor</a>

  <script>
    // The scene fades in once it has loaded.
    const scene = document.getElementById('scene');
    scene.addEventListener('load', () => {
      setTimeout(() => document.documentElement.classList.add('is-loaded'), 300);
    });
  </script>
</body>
</html>
